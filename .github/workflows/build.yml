      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ismail4G-v1.0-Debug
          path: app/build/outputs/apk/debug/app-debug.apk
