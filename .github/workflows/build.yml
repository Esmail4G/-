name: Build Yemen4G APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Extract project ZIP
        run: |
          ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"
          test -n "$ZIP_FILE"
          unzip -o "$ZIP_FILE" -d extracted
      - name: Find and build Android project
        run: |
          PROJECT_DIR="$(find extracted -type f -name settings.gradle -printf '%h\n' | head -1)"
          test -n "$PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Yemen4G-APK
          path: extracted/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
