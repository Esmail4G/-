name: Build Ismail4G APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Accept Android SDK licenses and install SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Extract intended project ZIP
        run: |
          ZIP_FILE="Ismail4G-Android-Project.zip"
          test -f "$ZIP_FILE" || { echo "Missing $ZIP_FILE"; exit 1; }
          unzip -o "$ZIP_FILE" -d extracted
      - name: Find and build Android project
        run: |
          PROJECT_FILE="$(find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
          test -n "$PROJECT_FILE" || { echo "No settings.gradle or settings.gradle.kts found in selected ZIP"; exit 1; }
          PROJECT_DIR="$(dirname "$PROJECT_FILE")"
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Ismail4G-APK
          path: extracted/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
